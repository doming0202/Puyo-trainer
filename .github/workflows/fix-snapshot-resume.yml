name: fix snapshot resume

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: make snapshot resume React-driven') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch resume path
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          marker = "  useEffect(() => {\n    const timer = window.setInterval(() => {\n      const running = gameRef.current.running && !editMode && !replayRef.current.playing"
          patch = """  useEffect(() => {\n    const onPauseResume = (event: Event) => {\n      const detail = (event as CustomEvent<{ key?: string; code?: string; ctrlKey?: boolean; shiftKey?: boolean; altKey?: boolean; metaKey?: boolean }>).detail ?? null\n      if (editMode || replayRef.current.playing) return\n\n      const current = gameRef.current\n      const elapsedMs = syncElapsed(false)\n      resetClock(elapsedMs)\n      const nextGame = { ...current, running: true }\n      gameRef.current = nextGame\n      setGame(nextGame)\n      setReplay(state => appendFrame(state, nextGame, elapsedMs))\n\n      if (detail?.code) {\n        const action = actionForKey(new KeyboardEvent('keydown', {\n          key: detail.key ?? '',\n          code: detail.code,\n          ctrlKey: detail.ctrlKey ?? false,\n          shiftKey: detail.shiftKey ?? false,\n          altKey: detail.altKey ?? false,\n          metaKey: detail.metaKey ?? false,\n        }))\n        if (action) dispatch(action)\n      }\n    }\n\n    window.addEventListener('puyo-game-resume', onPauseResume)\n    return () => window.removeEventListener('puyo-game-resume', onPauseResume)\n  }, [actionForKey, dispatch, editMode, resetClock, syncElapsed])\n\n"""
          if patch.strip() not in text:
              if marker not in text:
                  raise SystemExit('App marker not found')
              text = text.replace(marker, patch + marker, 1)
              app.write_text(text)

          pause = Path('src/pause-overlay.ts')
          text = pause.read_text()
          old = """      syntheticResume = true\n      document.body.dispatchEvent(new KeyboardEvent('keydown', {\n        key: 'f',\n        code: 'KeyF',\n        bubbles: true,\n        cancelable: true,\n      }))\n      syntheticResume = false\n\n      const eventToResume = pendingResumeEvent\n      pendingResumeEvent = null\n      if (eventToResume) {\n        window.setTimeout(() => {\n          document.body.dispatchEvent(new KeyboardEvent('keydown', {\n            key: eventToResume.key,\n            code: eventToResume.code,\n            ctrlKey: eventToResume.ctrlKey,\n            shiftKey: eventToResume.shiftKey,\n            altKey: eventToResume.altKey,\n            metaKey: eventToResume.metaKey,\n            bubbles: true,\n            cancelable: true,\n          }))\n        }, 0)\n      }\n"""
          new = """      const eventToResume = pendingResumeEvent\n      pendingResumeEvent = null\n      window.dispatchEvent(new CustomEvent('puyo-game-resume', {\n        detail: eventToResume,\n      }))\n"""
          if old not in text:
              raise SystemExit('pause resume block not found')
          text = text.replace(old, new, 1)
          pause.write_text(text)
          PY

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/pause-overlay.ts
          git commit -m "fix: make snapshot resume React-driven"
          git push
