name: verify-room-sync

on:
  push:
    paths:
      - .github/workflows/verify-room-sync.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert premature edit sync event
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')
          old = "  const setEditedBoard = (board: Board) => { editPlayerState(player => syncEditedBoardWithFalling(player, board)); window.dispatchEvent(new Event('puyo-room-state-changed')) }\n  const setEditedPair = (pair: PairEdit) => { editPlayerState(player => setPairColors(player, pair.axis, pair.child)); window.dispatchEvent(new Event('puyo-room-state-changed')) }\n"
          new = "  const setEditedBoard = (board: Board) => editPlayerState(player => syncEditedBoardWithFalling(player, board))\n  const setEditedPair = (pair: PairEdit) => editPlayerState(player => setPairColors(player, pair.axis, pair.child))\n"
          if old not in text:
              raise SystemExit('edit sync anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          
      - name: Verify build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit verified sources
        run: |
          rm .github/workflows/verify-room-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/verify-room-sync.yml
          git commit -m "Verify room action synchronization" 
          git push origin HEAD:main
