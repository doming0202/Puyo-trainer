name: fix-room-sync-lag

on:
  push:
    paths:
      - .github/workflows/fix-room-sync-lag.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove per-action snapshot serialization
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/RoomPanel.tsx')
          text = p.read_text(encoding='utf-8')
          old = """    const onLocalAction = (event: Event) =>\n      const detail = (event as CustomEvent<{ playerIndex: 0 | 1; action: RoomAction }>).detail\n      if (!detail || (detail.playerIndex !== 0 && detail.playerIndex !== 1) || typeof detail.action !== 'string') return\n      if (client.role === 'student') {\n        if (client.focus[detail.playerIndex] === client.memberId) client.sendAction(detail.playerIndex, detail.action)\n      } else if (client.role === 'coach') {\n        const currentGame = gameRef.current\n        const currentReplay = replayRef.current\n        const currentElapsed = timelineRef.current\n        client.sendState({ game: compactGame(currentGame), replay: compactReplay(currentReplay), elapsedMs: currentElapsed })\n        lastSnapshotSyncRef.current = Date.now()\n      }\n    }\n    const onRoomStateChanged = () => {\n      if (client.role !== 'coach') return\n      const currentGame = gameRef.current\n      const currentReplay = replayRef.current\n      const currentElapsed = timelineRef.current\n      client.sendState({ game: compactGame(currentGame), replay: compactReplay(currentReplay), elapsedMs: currentElapsed })\n      lastSnapshotSyncRef.current = Date.now()\n    }\n"""
          new = """    const onLocalAction = (event: Event) => {\n      const detail = (event as CustomEvent<{ playerIndex: 0 | 1; action: RoomAction }>).detail\n      if (!detail || (detail.playerIndex !== 0 && detail.playerIndex !== 1) || typeof detail.action !== 'string') return\n      if (client.role === 'student' && client.focus[detail.playerIndex] === client.memberId) {\n        client.sendAction(detail.playerIndex, detail.action)\n      }\n    }\n"""
          if old not in text:
              raise SystemExit('room action serialization block not found')
          text = text.replace(old, new, 1)
          old_cleanup = """      window.removeEventListener('puyo-room-local-action', onLocalAction)\n      window.removeEventListener('puyo-room-state-changed', onRoomStateChanged)\n"""
          new_cleanup = """      window.removeEventListener('puyo-room-local-action', onLocalAction)\n"""
          if old_cleanup not in text:
              raise SystemExit('room state changed cleanup block not found')
          text = text.replace(old_cleanup, new_cleanup, 1)
          p.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/fix-room-sync-lag.yml')
          wf.unlink()

      - name: Commit performance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RoomPanel.tsx .github/workflows/fix-room-sync-lag.yml
          git commit -m "fix: remove per-action room snapshot serialization"
          git push origin HEAD:main
