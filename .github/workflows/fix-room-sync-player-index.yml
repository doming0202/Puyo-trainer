name: fix-room-sync-player-index
on:
  push:
    paths:
      - .github/workflows/fix-room-sync-player-index.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-room-sync-player-index.mjs
      - run: |
          rm -f .github/workflows/fix-room-sync-player-index.yml scripts/fix-room-sync-player-index.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RoomPanel.tsx .github/workflows scripts
          git commit -m "Fix room sync player index typing"
          git push origin HEAD:main
