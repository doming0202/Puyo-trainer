name: One-time garbage marker patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-garbage-markers.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: add one-time garbage marker patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch App.tsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          old = "const COLOR_MAP: Record<PuyoColor, string> = { 1: '#ff5b68', 2: '#5aa7ff', 3: '#58d68d', 4: '#b66cff' }"
          new = """const GARBAGE_BASE = 'radial-gradient(circle at 34% 28%, #d6dbe0 0 15%, #9ba3ae 16% 58%, #626b78 59% 100%)'
          const GARBAGE_RING = `radial-gradient(circle, transparent 0 50%, #4f5864 51% 59%, transparent 60%), ${GARBAGE_BASE}`
          const GARBAGE_CROSS = `linear-gradient(#4f5864,#4f5864) center/58% 2px no-repeat, linear-gradient(90deg,#4f5864,#4f5864) center/2px 58% no-repeat, ${GARBAGE_BASE}`
          const GARBAGE_HEX = `linear-gradient(30deg, transparent 42%, #4f5864 43% 50%, transparent 51%), linear-gradient(150deg, transparent 42%, #4f5864 43% 50%, transparent 51%), linear-gradient(90deg, transparent 42%, #4f5864 43% 50%, transparent 51%), ${GARBAGE_BASE}`
          const GARBAGE_CIRCUIT = `radial-gradient(circle at 32% 32%, #4f5864 0 8%, transparent 9%), radial-gradient(circle at 68% 32%, #4f5864 0 8%, transparent 9%), radial-gradient(circle at 32% 68%, #4f5864 0 8%, transparent 9%), radial-gradient(circle at 68% 68%, #4f5864 0 8%, transparent 9%), linear-gradient(#4f5864,#4f5864) center/48% 2px no-repeat, linear-gradient(90deg,#4f5864,#4f5864) center/2px 48% no-repeat, ${GARBAGE_BASE}`
          const COLOR_MAP: Record<number, string> = {
            1: '#ff5b68',
            2: '#5aa7ff',
            3: '#58d68d',
            4: '#b66cff',
            5: GARBAGE_BASE,
            6: GARBAGE_RING,
            7: GARBAGE_CROSS,
            8: GARBAGE_HEX,
            9: GARBAGE_CIRCUIT,
          }"""
          if text.count(old) != 1:
              raise SystemExit('expected exactly one COLOR_MAP declaration')
          path.write_text(text.replace(old, new), newline='')
          PY

      - name: Commit App.tsx and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git rm .github/workflows/one-time-garbage-markers.yml
          git commit -m 'feat: add independent garbage markers'
          git push
