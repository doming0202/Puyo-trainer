name: fix-realtime-room-sync-v2

on:
  push:
    paths:
      - .github/workflows/fix-realtime-room-sync-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch realtime room flow
        shell: python
        run: |
          from pathlib import Path
          import re

          # room-client: player sync payload does not contain the deterministic sequence itself.
          p = Path('src/game/room-client.ts')
          text = p.read_text(encoding='utf-8')
          old = "export type RoomPlayerState = TurnState"
          if old not in text:
              raise SystemExit('room-client player state type anchor missing')
          text = text.replace(old, "export type RoomPlayerState = Omit<TurnState, 'puyoSequence'>", 1)
          old = "if (this._role !== 'student') return\n    this.send({ type: 'student-action', playerIndex, action })"
          if old not in text:
              raise SystemExit('room-client sendAction anchor missing')
          text = text.replace(old, "if (!this._role) return\n    this.send({ type: 'student-action', playerIndex, action })", 1)
          p.write_text(text, encoding='utf-8')

          # server: allow coach + student actions; only non-global actions need focus ownership.
          p = Path('server/room-server.mjs')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r"  if \(message\.type === 'student-action'\) \{.*?\n  \}\n\n  if \(message\.type === 'player-state'", re.S)
          replacement = """  if (message.type === 'student-action') {
    const playerIndex = Number(message.playerIndex)
    const action = typeof message.action === 'string' ? message.action : ''
    const allowedActions = new Set([
      'left', 'right', 'rotate-left', 'rotate-right', 'soft-drop', 'hard-drop',
      'reset-turn', 'undo', 'redo', 'toggle-player-pause', 'global-pause',
    ])
    if (!Number.isInteger(playerIndex) || playerIndex < 0 || playerIndex > 1 || !allowedActions.has(action)) {
      return send(socket, { type: 'error', code: 'invalid-room-action', message: '無効なルーム操作です' })
    }
    if (action !== 'global-pause' && room.focus[playerIndex] !== member.id) {
      return send(socket, { type: 'error', code: 'focus-not-owned', message: 'このPlayerの操作権を持っていません' })
    }
    broadcast(room, { type: 'student-action', playerIndex, action }, socket)
    return
  }

  if (message.type === 'player-state'"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('server action block missing')
          p.write_text(text, encoding='utf-8')

          # RoomPanel: action goes over websocket immediately for both roles. Live/replay sync is disabled during play.
          p = Path('src/components/RoomPanel.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('const LIVE_INTERVAL_MS = 500', 'const LIVE_INTERVAL_MS = 1000', 1)
          text = text.replace("const { turnStart: _turnStart, undoStack: _undoStack, redoStack: _redoStack, ...state } = player", "const { turnStart: _turnStart, undoStack: _undoStack, redoStack: _redoStack, puyoSequence: _puyoSequence, ...state } = player", 1)
          old = """    const onLocalAction = (event: Event) => {
      const detail = (event as CustomEvent<{ playerIndex: 0 | 1; action: RoomAction }>).detail
      if (!detail || (detail.playerIndex !== 0 && detail.playerIndex !== 1) || typeof detail.action !== 'string') return
      if (client.role === 'student') {
        if (client.focus[detail.playerIndex] === client.memberId) client.sendAction(detail.playerIndex, detail.action)
        return
      }
      if (client.role === 'coach') {
        const currentGame = gameRef.current
        client.sendPlayerState({
          playerIndex: detail.playerIndex,
          player: compactPlayerState(currentGame.players[detail.playerIndex]),
          tick: currentGame.tick,
          activePlayer: currentGame.activePlayer,
          running: currentGame.running,
          elapsedMs: timelineRef.current,
        })
      }
    }
"""
          new = """    const onLocalAction = (event: Event) => {
      const detail = (event as CustomEvent<{ playerIndex: 0 | 1; action: RoomAction }>).detail
      if (!detail || (detail.playerIndex !== 0 && detail.playerIndex !== 1) || typeof detail.action !== 'string') return
      if (!client.role) return
      if (detail.action !== 'global-pause' && client.focus[detail.playerIndex] !== client.memberId) return
      client.sendAction(detail.playerIndex, detail.action)
    }
"""
          if old not in text:
              raise SystemExit('RoomPanel action block missing')
          text = text.replace(old, new, 1)
          old = """      if (currentElapsed + 80 < lastElapsed || gameRef.current.tick === 0 || Date.now() - lastSnapshotSyncRef.current >= SNAPSHOT_INTERVAL_MS) {
        client.sendState({
          game: compactGame(gameRef.current),
          replay: compactReplay(currentReplay),
          elapsedMs: currentElapsed,
        })
        lastSnapshotSyncRef.current = Date.now()
      }
      client.sendLiveState({
        elapsedMs: currentElapsed,
        cursorElapsedMs: currentReplay.frames[currentReplay.cursor]?.elapsedMs ?? currentElapsed,
        playing: currentReplay.playing,
        speed: currentReplay.speed,
      })
"""
          new = """      if (!gameRef.current.running && (currentElapsed + 80 < lastElapsed || gameRef.current.tick === 0 || Date.now() - lastSnapshotSyncRef.current >= SNAPSHOT_INTERVAL_MS)) {
        client.sendState({
          game: compactGame(gameRef.current),
          replay: compactReplay(currentReplay),
          elapsedMs: currentElapsed,
        })
        lastSnapshotSyncRef.current = Date.now()
      }
      if (!gameRef.current.running || currentReplay.playing) {
        client.sendLiveState({
          elapsedMs: currentElapsed,
          cursorElapsedMs: currentReplay.frames[currentReplay.cursor]?.elapsedMs ?? currentElapsed,
          playing: currentReplay.playing,
          speed: currentReplay.speed,
        })
      }
"""
          if old not in text:
              raise SystemExit('RoomPanel interval block missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # App: prevent replay sync from touching a running game; keep corrections from resetting the local clock.
          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')
          old = """  const applyRemoteRoomLiveState = useCallback((state: SharedRoomLiveState) => {
    const currentReplay = replayRef.current
    const cursorElapsed = Math.max(0, state.cursorElapsedMs)
    const cursor = findFrameAtElapsed(currentReplay.frames, cursorElapsed)
    const frame = currentReplay.frames[cursor]
    const nextReplay: ReplayState = { ...currentReplay, cursor, playing: state.playing, speed: state.speed }
    if (frame) {
      const nextGame = frameToGame(frame, false)
      gameRef.current = nextGame
      setGame(nextGame)
    }
    replayRef.current = nextReplay
    setReplay(nextReplay)
    resetClock(state.elapsedMs)
  }, [resetClock])
"""
          new = """  const applyRemoteRoomLiveState = useCallback((state: SharedRoomLiveState) => {
    if (gameRef.current.running) return
    const currentReplay = replayRef.current
    const cursorElapsed = Math.max(0, state.cursorElapsedMs)
    const cursor = findFrameAtElapsed(currentReplay.frames, cursorElapsed)
    const frame = currentReplay.frames[cursor]
    const nextReplay: ReplayState = { ...currentReplay, cursor, playing: state.playing, speed: state.speed }
    if (frame) {
      const nextGame = frameToGame(frame, false)
      gameRef.current = nextGame
      setGame(nextGame)
    }
    replayRef.current = nextReplay
    setReplay(nextReplay)
    resetClock(state.elapsedMs)
  }, [resetClock])
"""
          if old not in text:
              raise SystemExit('App live state block missing')
          text = text.replace(old, new, 1)
          old = """  const applyRemoteRoomPlayerState = useCallback((state: RoomPlayerStateSync) => {
    const current = gameRef.current
    if (state.tick < current.tick) return
    const currentPlayer = current.players[state.playerIndex]
    const nextPlayer: PlayerState = {
      ...currentPlayer,
      ...state.player,
      puyoSequence: state.player.puyoSequence,
    }
"""
          new = """  const applyRemoteRoomPlayerState = useCallback((state: RoomPlayerStateSync) => {
    const current = gameRef.current
    if (state.tick < current.tick) return
    const currentPlayer = current.players[state.playerIndex]
    const puyoSequence = currentPlayer.puyoSequenceSeed === state.player.puyoSequenceSeed
      ? currentPlayer.puyoSequence
      : generatePuyoSequence(state.player.puyoSequenceSeed)
    const nextPlayer: PlayerState = {
      ...currentPlayer,
      ...state.player,
      puyoSequence,
    }
"""
          if old not in text:
              raise SystemExit('App player state block missing')
          text = text.replace(old, new, 1)
          old = "    gameRef.current = nextGame\n    setGame(nextGame)\n    resetClock(state.elapsedMs)\n  }, [resetClock])\n\n  useEffect(() => {\n    const onPlayerState"
          new = "    gameRef.current = nextGame\n    setGame(nextGame)\n  }, [])\n\n  useEffect(() => {\n    const onPlayerState"
          if old not in text:
              raise SystemExit('App player state reset block missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

      - name: Remove temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/fix-realtime-room-sync-v2.yml
          rm -f .github/workflows/fix-realtime-room-sync.yml
          rm -f .github/workflows/fix-room-panel-syntax.yml
          rm -f .github/workflows/fix-room-sync-order.yml
          rm -f .github/workflows/fix-room-sync-player-index.yml
          rm -f .github/workflows/implement-lightweight-room-state-sync.yml
          rm -f .github/workflows/verify-room-sync.yml
          rm -f .github/workflows/fix-room-sync-lag.yml
          rm -f .github/workflows/fix-room-sync-lag-v2.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/RoomPanel.tsx src/game/room-client.ts server/room-server.mjs .github/workflows
          git commit -m "Fix realtime room sync and pause"
          git push origin HEAD:main
