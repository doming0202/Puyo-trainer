name: fix-realtime-match

on:
  push:
    paths:
      - .github/workflows/fix-realtime-match.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch realtime match synchronization
        shell: python
        run: |
          from pathlib import Path
          import re

          # room-client.ts: action relay is valid for coach and student; sequence is reconstructed locally.
          p = Path('src/game/room-client.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("export type RoomPlayerState = TurnState", "export type RoomPlayerState = Omit<TurnState, 'puyoSequence'>", 1)
          text = text.replace("if (this._role !== 'student') return\n    this.send({ type: 'student-action', playerIndex, action })", "if (!this._role) return\n    this.send({ type: 'student-action', playerIndex, action })", 1)
          p.write_text(text, encoding='utf-8')

          # server/room-server.mjs: accept action relay from either participant, with focus authorization.
          p = Path('server/room-server.mjs')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r"  if \(message\.type === 'student-action'\) \{.*?\n  \}\n\n  if \(message\.type === 'player-state'", re.S)
          replacement = """  if (message.type === 'student-action') {
    const playerIndex = Number(message.playerIndex)
    const action = typeof message.action === 'string' ? message.action : ''
    const allowedActions = new Set([
      'left', 'right', 'rotate-left', 'rotate-right', 'soft-drop', 'hard-drop',
      'reset-turn', 'undo', 'redo', 'toggle-player-pause', 'global-pause',
    ])
    if (!Number.isInteger(playerIndex) || playerIndex < 0 || playerIndex > 1 || !allowedActions.has(action)) {
      return send(socket, { type: 'error', code: 'invalid-room-action', message: '無効なルーム操作です' })
    }
    if (action !== 'global-pause' && room.focus[playerIndex] !== member.id) {
      return send(socket, { type: 'error', code: 'focus-not-owned', message: 'このPlayerの操作権を持っていません' })
    }
    broadcast(room, { type: 'student-action', playerIndex, action }, socket)
    return
  }

  if (message.type === 'player-state'"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('server action block not found')
          p.write_text(text, encoding='utf-8')

          # RoomPanel.tsx: action-only realtime path; full snapshots are only used while stopped/replaying.
          p = Path('src/components/RoomPanel.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace("const LIVE_INTERVAL_MS = 500", "const LIVE_INTERVAL_MS = 1000", 1)
          text = text.replace("const { turnStart: _turnStart, undoStack: _undoStack, redoStack: _redoStack, ...state } = player", "const { turnStart: _turnStart, undoStack: _undoStack, redoStack: _redoStack, puyoSequence: _puyoSequence, ...state } = player", 1)
          action_pattern = re.compile(r"    const onLocalAction = \(event: Event\) => \{.*?\n    \}\n    window\.addEventListener\('puyo-room-request-focus'", re.S)
          action_replacement = """    const onLocalAction = (event: Event) => {
      const detail = (event as CustomEvent<{ playerIndex: 0 | 1; action: RoomAction }>).detail
      if (!detail || (detail.playerIndex !== 0 && detail.playerIndex !== 1) || typeof detail.action !== 'string') return
      if (!client.role) return
      if (detail.action !== 'global-pause' && client.focus[detail.playerIndex] !== client.memberId) return
      client.sendAction(detail.playerIndex, detail.action)
    }
    window.addEventListener('puyo-room-request-focus'"""
          text, count = action_pattern.subn(action_replacement, text, count=1)
          if count != 1:
              raise SystemExit('RoomPanel action handler not found')
          interval_pattern = re.compile(r"  useEffect\(\(\) => \{\n    if \(!open \|\| role !== 'coach'\) return\n    const timer = window\.setInterval\(\(\) => \{.*?\n    return \(\) => window\.clearInterval\(timer\)\n  \}, \[open, role\]\)", re.S)
          interval_replacement = """  useEffect(() => {
    if (!open || role !== 'coach') return
    const timer = window.setInterval(() => {
      const client = clientRef.current
      if (!client || client.role !== 'coach') return
      const currentReplay = replayRef.current
      const currentElapsed = Math.max(0, timelineRef.current)
      if (!gameRef.current.running && (gameRef.current.tick === 0 || Date.now() - lastSnapshotSyncRef.current >= SNAPSHOT_INTERVAL_MS)) {
        client.sendState({
          game: compactGame(gameRef.current),
          replay: compactReplay(currentReplay),
          elapsedMs: currentElapsed,
        })
        lastSnapshotSyncRef.current = Date.now()
      }
      if (!gameRef.current.running || currentReplay.playing) {
        client.sendLiveState({
          elapsedMs: currentElapsed,
          cursorElapsedMs: currentReplay.frames[currentReplay.cursor]?.elapsedMs ?? currentElapsed,
          playing: currentReplay.playing,
          speed: currentReplay.speed,
        })
      }
      if (gameRef.current.running) {
        for (const playerIndex of [0, 1] as const) {
          client.sendPlayerState({
            playerIndex,
            player: compactPlayerState(gameRef.current.players[playerIndex]),
            tick: gameRef.current.tick,
            activePlayer: gameRef.current.activePlayer,
            running: gameRef.current.running,
            elapsedMs: currentElapsed,
          })
        }
      }
    }, LIVE_INTERVAL_MS)
    return () => window.clearInterval(timer)
  }, [open, role])"""
          text, count = interval_pattern.subn(interval_replacement, text, count=1)
          if count != 1:
              raise SystemExit('RoomPanel sync interval not found')
          p.write_text(text, encoding='utf-8')

          # App.tsx: replay sync cannot overwrite a live game; player corrections never reset a running clock.
          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')
          live_pattern = re.compile(r"  const applyRemoteRoomLiveState = useCallback\(\(state: SharedRoomLiveState\) => \{.*?\n  \}, \[resetClock\]\)\n", re.S)
          live_replacement = """  const applyRemoteRoomLiveState = useCallback((state: SharedRoomLiveState) => {
    if (gameRef.current.running) return
    const currentReplay = replayRef.current
    const cursorElapsed = Math.max(0, state.cursorElapsedMs)
    const cursor = findFrameAtElapsed(currentReplay.frames, cursorElapsed)
    const frame = currentReplay.frames[cursor]
    const nextReplay: ReplayState = { ...currentReplay, cursor, playing: state.playing, speed: state.speed }
    if (frame) {
      const nextGame = frameToGame(frame, false)
      gameRef.current = nextGame
      setGame(nextGame)
    }
    replayRef.current = nextReplay
    setReplay(nextReplay)
    resetClock(state.elapsedMs)
  }, [resetClock])
"""
          text, count = live_pattern.subn(live_replacement, text, count=1)
          if count != 1:
              raise SystemExit('App live state handler not found')
          player_pattern = re.compile(r"  const applyRemoteRoomPlayerState = useCallback\(\(state: RoomPlayerStateSync\) => \{.*?\n  \}, \[resetClock\]\)\n", re.S)
          player_replacement = """  const applyRemoteRoomPlayerState = useCallback((state: RoomPlayerStateSync) => {
    const current = gameRef.current
    if (state.tick < current.tick) return
    const currentPlayer = current.players[state.playerIndex]
    const puyoSequence = currentPlayer.puyoSequenceSeed === state.player.puyoSequenceSeed
      ? currentPlayer.puyoSequence
      : generatePuyoSequence(state.player.puyoSequenceSeed)
    const nextPlayer: PlayerState = {
      ...currentPlayer,
      ...state.player,
      puyoSequence,
    }
    const players = [...current.players] as [PlayerState, PlayerState]
    players[state.playerIndex] = nextPlayer
    const nextGame = {
      ...current,
      players,
      activePlayer: state.activePlayer,
      running: state.running,
      tick: state.tick,
    }
    gameRef.current = nextGame
    setGame(nextGame)
    if (current.running !== state.running) resetClock(state.elapsedMs)
  }, [resetClock])
"""
          text, count = player_pattern.subn(player_replacement, text, count=1)
          if count != 1:
              raise SystemExit('App player state handler not found')
          # Remove the remote-action echo that can create action loops.
          echo = "      window.dispatchEvent(new CustomEvent('puyo-room-local-action', { detail: { playerIndex: detail.playerIndex, action: detail.action } }))\n"
          if echo not in text:
              raise SystemExit('remote action echo not found')
          text = text.replace(echo, '', 1)
          p.write_text(text, encoding='utf-8')

      - name: Cleanup temporary workflows
        shell: bash
        run: |
          rm -f .github/workflows/fix-realtime-room-sync-v2.yml
          rm -f .github/workflows/fix-realtime-room-sync.yml
          rm -f .github/workflows/fix-room-panel-syntax.yml
          rm -f .github/workflows/fix-room-sync-order.yml
          rm -f .github/workflows/fix-room-sync-player-index.yml
          rm -f .github/workflows/implement-lightweight-room-state-sync.yml
          rm -f .github/workflows/verify-room-sync.yml
          rm -f .github/workflows/fix-room-sync-lag.yml
          rm -f .github/workflows/fix-room-sync-lag-v2.yml
          rm -f .github/workflows/fix-realtime-match.yml

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/RoomPanel.tsx src/game/room-client.ts server/room-server.mjs .github/workflows
          git diff --cached --quiet && exit 0
          git commit -m "Fix realtime match synchronization"
          git push origin HEAD:main
