name: fix-room-panel-syntax

on:
  push:
    paths:
      - .github/workflows/fix-room-panel-syntax.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix RoomPanel interval syntax
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/RoomPanel.tsx')
          text = p.read_text(encoding='utf-8')
          old = """      for (const playerIndex of [0, 1] as const)\n        client.sendPlayerState({\n          playerIndex,\n          player: compactPlayerState(gameRef.current.players[playerIndex]),\n          tick: gameRef.current.tick,\n          activePlayer: gameRef.current.activePlayer,\n          running: gameRef.current.running,\n          elapsedMs: currentElapsed,\n        })\n      }\n"""
          new = """      for (const playerIndex of [0, 1] as const) {\n        client.sendPlayerState({\n          playerIndex,\n          player: compactPlayerState(gameRef.current.players[playerIndex]),\n          tick: gameRef.current.tick,\n          activePlayer: gameRef.current.activePlayer,\n          running: gameRef.current.running,\n          elapsedMs: currentElapsed,\n        })\n      }\n"""
          if old not in text:
              raise SystemExit('expected malformed for-loop not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/fix-room-panel-syntax.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RoomPanel.tsx .github/workflows/fix-room-panel-syntax.yml
          git commit -m "Fix RoomPanel interval syntax"
          git push origin HEAD:main
