name: implement-lightweight-room-state-sync
on:
  push:
    paths:
      - .github/workflows/implement-lightweight-room-state-sync.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/apply-lightweight-room-sync.mjs
      - name: Cleanup patch files
        run: |
          rm -f .github/workflows/implement-lightweight-room-state-sync.yml
          rm -f .github/workflows/fix-room-sync-lag.yml
          rm -f .github/workflows/fix-room-sync-lag-v2.yml
          rm -f .github/workflows/verify-room-sync.yml
          rm -f scripts/apply-lightweight-room-sync.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/room-client.ts src/App.tsx src/components/RoomPanel.tsx server/room-server.mjs .github/workflows scripts
          git commit -m "Implement lightweight room state synchronization"
          git push origin HEAD:main
