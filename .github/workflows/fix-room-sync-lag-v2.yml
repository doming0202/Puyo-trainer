name: fix-room-sync-lag-v2

on:
  push:
    paths:
      - .github/workflows/fix-room-sync-lag-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove per-action snapshot serialization
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/components/RoomPanel.tsx')
          text = p.read_text(encoding='utf-8')
          start_marker = "    const onLocalAction = (event: Event) =>"
          end_marker = "    window.addEventListener('puyo-room-request-focus', onFocusRequest)"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('room action handler anchors not found')
          replacement = """    const onLocalAction = (event: Event) => {\n      const detail = (event as CustomEvent<{ playerIndex: 0 | 1; action: RoomAction }>).detail\n      if (!detail || (detail.playerIndex !== 0 && detail.playerIndex !== 1) || typeof detail.action !== 'string') return\n      if (client.role === 'student' && client.focus[detail.playerIndex] === client.memberId) {\n        client.sendAction(detail.playerIndex, detail.action)\n      }\n    }\n"""
          text = text[:start] + replacement + text[end:]
          text = re.sub(r"\n    window\.addEventListener\('puyo-room-state-changed', onRoomStateChanged\)", '', text, count=1)
          text = re.sub(r"\n      window\.removeEventListener\('puyo-room-state-changed', onRoomStateChanged\)", '', text, count=1)
          p.write_text(text, encoding='utf-8')

          for workflow in [
              Path('.github/workflows/fix-room-sync-lag.yml'),
              Path('.github/workflows/fix-room-sync-lag-v2.yml'),
          ]:
              if workflow.exists():
                  workflow.unlink()

      - name: Commit performance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RoomPanel.tsx .github/workflows/fix-room-sync-lag.yml .github/workflows/fix-room-sync-lag-v2.yml
          git commit -m "fix: remove per-action room snapshot serialization"
          git push origin HEAD:main
