name: fix-room-stop-sync

on:
  push:
    paths:
      - .github/workflows/fix-room-stop-sync.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch realtime room synchronization
        shell: python
        run: |
          from pathlib import Path
          import re

          # room-client.ts: add an explicit global running-state channel and let either room role relay actions.
          p = Path('src/game/room-client.ts')
          text = p.read_text(encoding='utf-8')
          text = text.replace("export type RoomAction = GameplayAction | 'global-pause'\n", "export type RoomAction = GameplayAction | 'global-pause'\n\nexport interface RoomControlState {\n  running: boolean\n  elapsedMs: number\n  revision: number\n}\n", 1)
          text = text.replace("export type RoomPlayerState = TurnState", "export type RoomPlayerState = Omit<TurnState, 'puyoSequence'>", 1)
          text = text.replace("  | { type: 'room-joined'; roomId: string; role: RoomRole; memberId: string; studentCount: number; state: SharedRoomState | null; liveState: SharedRoomLiveState | null; focus: RoomFocusState }", "  | { type: 'room-joined'; roomId: string; role: RoomRole; memberId: string; studentCount: number; state: SharedRoomState | null; liveState: SharedRoomLiveState | null; focus: RoomFocusState; roomControl: RoomControlState | null }", 1)
          text = text.replace("  | { type: 'live-state'; state: SharedRoomLiveState }\n", "  | { type: 'live-state'; state: SharedRoomLiveState }\n  | { type: 'room-control'; control: RoomControlState }\n", 1)
          text = text.replace("if (this._role !== 'student') return\n    this.send({ type: 'student-action', playerIndex, action })", "if (!this._role) return\n    this.send({ type: 'student-action', playerIndex, action })", 1)
          marker = "  sendLiveState(state: SharedRoomLiveState): void {\n    if (this._role !== 'coach') return\n    this.send({ type: 'live-state', state })\n  }\n"
          replacement = marker + "\n  sendRoomControl(running: boolean, elapsedMs: number): void {\n    if (!this._role) return\n    this.send({ type: 'room-control', control: { running, elapsedMs } })\n  }\n"
          if marker not in text:
              raise SystemExit('room-client live-state anchor missing')
          text = text.replace(marker, replacement, 1)
          p.write_text(text, encoding='utf-8')

          # server: keep the current global running state authoritative and relay stop/resume independently from gameplay actions.
          p = Path('server/room-server.mjs')
          text = p.read_text(encoding='utf-8')
          text = text.replace("      liveState: null,\n      focus: [null, null],", "      liveState: null,\n      control: { running: true, elapsedMs: 0, revision: 0 },\n      focus: [null, null],", 1)
          text = text.replace("      liveState: role === 'student' ? room.liveState : null,\n      focus: focusState(room),", "      liveState: role === 'student' ? room.liveState : null,\n      roomControl: role === 'student' ? room.control : null,\n      focus: focusState(room),", 1)
          state_anchor = "  if (message.type === 'state' && member.role === 'coach') {\n    const state = sanitizeState(message.state)\n    if (!state) return\n    room.state = state\n    broadcast(room, { type: 'state', state }, socket)\n    return\n  }\n"
          state_replacement = """  if (message.type === 'state' && member.role === 'coach') {
    const state = sanitizeState(message.state)
    if (!state) return
    room.state = state
    const running = Boolean(state.game?.running)
    const elapsedMs = Number.isFinite(state.elapsedMs) ? Math.max(0, state.elapsedMs) : room.control.elapsedMs
    room.control = { running, elapsedMs, revision: room.control.revision + 1 }
    broadcast(room, { type: 'state', state }, socket)
    broadcast(room, { type: 'room-control', control: room.control }, socket)
    return
  }

  if (message.type === 'room-control') {
    const incoming = message.control
    if (!incoming || typeof incoming !== 'object') return
    const running = Boolean(incoming.running)
    const elapsedMs = Number.isFinite(incoming.elapsedMs) ? Math.max(0, Number(incoming.elapsedMs)) : room.control.elapsedMs
    room.control = { running, elapsedMs, revision: room.control.revision + 1 }
    if (room.state?.game && typeof room.state.game === 'object') {
      room.state = {
        ...room.state,
        game: { ...room.state.game, running },
        elapsedMs,
      }
    }
    broadcast(room, { type: 'room-control', control: room.control }, socket)
    return
  }
"""
          if state_anchor not in text:
              raise SystemExit('server state anchor missing')
          text = text.replace(state_anchor, state_replacement, 1)
          player_anchor = "  if (message.type === 'player-state' && member.role === 'coach') {\n    const state = message.state\n    if (!state || typeof state !== 'object') return\n"
          player_replacement = "  if (message.type === 'player-state' && member.role === 'coach') {\n    const state = message.state\n    if (!state || typeof state !== 'object') return\n    if (room.control && state.running !== room.control.running) return\n"
          if player_anchor not in text:
              raise SystemExit('server player-state anchor missing')
          text = text.replace(player_anchor, player_replacement, 1)
          p.write_text(text, encoding='utf-8')

          # RoomPanel.tsx: immediate action/control events plus low-frequency corrective snapshots only when a controlled player changed.
          p = Path('src/components/RoomPanel.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace("const LIVE_INTERVAL_MS = 500", "const LIVE_INTERVAL_MS = 1000", 1)
          text = text.replace("const { turnStart: _turnStart, undoStack: _undoStack, redoStack: _redoStack, ...state } = player", "const { turnStart: _turnStart, undoStack: _undoStack, redoStack: _redoStack, puyoSequence: _puyoSequence, ...state } = player", 1)
          text = text.replace("      } else if (message.type === 'live-state') {\n        if (message.state && client.role === 'student' && followCoachRef.current) onRemoteLiveState(message.state)\n", "      } else if (message.type === 'live-state') {\n        if (message.state && client.role === 'student' && followCoachRef.current) onRemoteLiveState(message.state)\n      } else if (message.type === 'room-control') {\n        window.dispatchEvent(new CustomEvent('puyo-room-control', { detail: message.control }))\n", 1)
          action_pattern = re.compile(r"    const onLocalAction = \(event: Event\) => \{.*?\n    \}\n    window\.addEventListener\('puyo-room-request-focus'", re.S)
          action_replacement = """    const onLocalAction = (event: Event) => {
      const detail = (event as CustomEvent<{ playerIndex: 0 | 1; action: RoomAction }>).detail
      if (!detail || (detail.playerIndex !== 0 && detail.playerIndex !== 1) || typeof detail.action !== 'string') return
      if (!client.role) return
      if (detail.action !== 'global-pause' && client.focus[detail.playerIndex] !== client.memberId) return
      client.sendAction(detail.playerIndex, detail.action)
    }
    const onLocalControl = (event: Event) => {
      const detail = (event as CustomEvent<{ running: boolean; elapsedMs: number }>).detail
      if (!detail || !client.role) return
      client.sendRoomControl(Boolean(detail.running), Math.max(0, Number(detail.elapsedMs) || 0))
    }
    window.addEventListener('puyo-room-request-focus'"""
          text, count = action_pattern.subn(action_replacement, text, count=1)
          if count != 1:
              raise SystemExit('RoomPanel action block missing')
          text = text.replace("    window.addEventListener('puyo-room-release-focus', onFocusRelease)\n    window.addEventListener('puyo-room-local-action', onLocalAction)", "    window.addEventListener('puyo-room-release-focus', onFocusRelease)\n    window.addEventListener('puyo-room-local-action', onLocalAction)\n    window.addEventListener('puyo-room-local-control', onLocalControl)", 1)
          text = text.replace("      window.removeEventListener('puyo-room-release-focus', onFocusRelease)\n      window.removeEventListener('puyo-room-local-action', onLocalAction)", "      window.removeEventListener('puyo-room-release-focus', onFocusRelease)\n      window.removeEventListener('puyo-room-local-action', onLocalAction)\n      window.removeEventListener('puyo-room-local-control', onLocalControl)", 1)
          # Add per-player last-sent ticks beside the existing snapshot ref.
          text = text.replace("  const lastSnapshotSyncRef = useRef(0)\n", "  const lastSnapshotSyncRef = useRef(0)\n  const lastPlayerSyncTickRef = useRef<[number, number]>([-1, -1])\n", 1)
          interval_pattern = re.compile(r"  useEffect\(\(\) => \{\n    if \(!open \|\| role !== 'coach'\) return\n    const timer = window\.setInterval\(\(\) => \{.*?\n    return \(\) => window\.clearInterval\(timer\)\n  \}, \[open, role\]\)", re.S)
          interval_replacement = """  useEffect(() => {
    if (!open || role !== 'coach') return
    const timer = window.setInterval(() => {
      const client = clientRef.current
      if (!client || client.role !== 'coach') return
      const currentReplay = replayRef.current
      const currentElapsed = Math.max(0, timelineRef.current)
      if (!gameRef.current.running && (gameRef.current.tick === 0 || Date.now() - lastSnapshotSyncRef.current >= SNAPSHOT_INTERVAL_MS)) {
        client.sendState({
          game: compactGame(gameRef.current),
          replay: compactReplay(currentReplay),
          elapsedMs: currentElapsed,
        })
        lastSnapshotSyncRef.current = Date.now()
      }
      if (!gameRef.current.running || currentReplay.playing) {
        client.sendLiveState({
          elapsedMs: currentElapsed,
          cursorElapsedMs: currentReplay.frames[currentReplay.cursor]?.elapsedMs ?? currentElapsed,
          playing: currentReplay.playing,
          speed: currentReplay.speed,
        })
      }
      if (gameRef.current.running) {
        for (const playerIndex of [0, 1] as const) {
          if (client.focus[playerIndex] !== client.memberId) continue
          if (lastPlayerSyncTickRef.current[playerIndex] === gameRef.current.tick) continue
          client.sendPlayerState({
            playerIndex,
            player: compactPlayerState(gameRef.current.players[playerIndex]),
            tick: gameRef.current.tick,
            activePlayer: gameRef.current.activePlayer,
            running: gameRef.current.running,
            elapsedMs: currentElapsed,
          })
          lastPlayerSyncTickRef.current[playerIndex] = gameRef.current.tick
        }
      }
    }, LIVE_INTERVAL_MS)
    return () => window.clearInterval(timer)
  }, [open, role])"""
          text, count = interval_pattern.subn(interval_replacement, text, count=1)
          if count != 1:
              raise SystemExit('RoomPanel interval block missing')
          text = text.replace("        if (message.state && message.role === 'student') onRemoteLiveState(message.liveState)\n", "        if (message.state && message.role === 'student') onRemoteLiveState(message.liveState)\n        if (message.roomControl && message.role === 'student') window.dispatchEvent(new CustomEvent('puyo-room-control', { detail: message.roomControl }))\n", 1)
          p.write_text(text, encoding='utf-8')

          # App.tsx: route global stop/resume through room-control; never echo remote actions; reconstruct deterministic sequence from seed.
          p = Path('src/App.tsx')
          text = p.read_text(encoding='utf-8')
          player_old = """  const applyRemoteRoomPlayerState = useCallback((state: RoomPlayerStateSync) => {
    const current = gameRef.current
    if (state.tick < current.tick) return
    const currentPlayer = current.players[state.playerIndex]
    const nextPlayer: PlayerState = {
      ...currentPlayer,
      ...state.player,
      puyoSequence: state.player.puyoSequence,
    }
    const players = [...current.players] as [PlayerState, PlayerState]
    players[state.playerIndex] = nextPlayer
    const nextGame = {
      ...current,
      players,
      activePlayer: state.activePlayer,
      running: state.running,
      tick: state.tick,
    }
    gameRef.current = nextGame
    setGame(nextGame)
    resetClock(state.elapsedMs)
  }, [resetClock])
"""
          player_new = """  const applyRemoteRoomPlayerState = useCallback((state: RoomPlayerStateSync) => {
    const current = gameRef.current
    if (state.tick < current.tick) return
    const currentPlayer = current.players[state.playerIndex]
    const puyoSequence = currentPlayer.puyoSequenceSeed === state.player.puyoSequenceSeed
      ? currentPlayer.puyoSequence
      : generatePuyoSequence(state.player.puyoSequenceSeed)
    const nextPlayer: PlayerState = {
      ...currentPlayer,
      ...state.player,
      puyoSequence,
    }
    const players = [...current.players] as [PlayerState, PlayerState]
    players[state.playerIndex] = nextPlayer
    const nextGame = {
      ...current,
      players,
      activePlayer: state.activePlayer,
      running: state.running,
      tick: state.tick,
    }
    gameRef.current = nextGame
    setGame(nextGame)
    if (current.running !== state.running) resetClock(state.elapsedMs)
  }, [resetClock])
"""
          if player_old not in text:
              raise SystemExit('App player-state handler missing')
          text = text.replace(player_old, player_new, 1)
          control_anchor = """  const applyRemoteRoomPlayerState = useCallback((state: RoomPlayerStateSync) => {"""
          control_block = """  const applyRemoteRoomControl = useCallback((control: { running: boolean; elapsedMs: number; revision: number }) => {
    const current = gameRef.current
    const running = Boolean(control.running)
    const nextGame = { ...current, running }
    gameRef.current = nextGame
    setGame(nextGame)
    setReplay(state => state.playing ? { ...state, playing: false } : state)
    if (current.running !== running || !running) resetClock(control.elapsedMs)
  }, [resetClock])

""" + control_anchor
          if control_anchor not in text:
              raise SystemExit('App control anchor missing')
          text = text.replace(control_anchor, control_block, 1)
          text = text.replace("  useEffect(() => {\n    const onPlayerState = (event: Event) => {", "  useEffect(() => {\n    const onRoomControl = (event: Event) => {\n      const control = (event as CustomEvent<{ running: boolean; elapsedMs: number; revision: number }>).detail\n      if (!control) return\n      applyRemoteRoomControl(control)\n    }\n    window.addEventListener('puyo-room-control', onRoomControl)\n    return () => window.removeEventListener('puyo-room-control', onRoomControl)\n  }, [applyRemoteRoomControl])\n\n  useEffect(() => {\n    const onPlayerState = (event: Event) => {", 1)
          text = text.replace("          setReplay(state => appendFrame(state, nextGame, elapsedMs))\n        }\n        window.dispatchEvent(new Event('puyo-room-state-changed'))\n        return\n", "          setReplay(state => appendFrame(state, nextGame, elapsedMs))\n        }\n        window.dispatchEvent(new Event('puyo-room-state-changed'))\n        return\n", 1)
          # F/global pause emits control after local state transition.
          old_f = """          window.dispatchEvent(new CustomEvent('puyo-room-local-action', { detail: { playerIndex: focusedPlayer, action: 'global-pause' } }))
"""
          new_f = """          window.dispatchEvent(new CustomEvent('puyo-room-local-control', { detail: { running: nextGame.running, elapsedMs } }))
"""
          if old_f not in text:
              raise SystemExit('App F room action anchor missing')
          text = text.replace(old_f, new_f, 1)
          # Remove remote action echo; the origin already sent the action.
          echo = "      window.dispatchEvent(new CustomEvent('puyo-room-local-action', { detail: { playerIndex: detail.playerIndex, action: detail.action } }))\n"
          if echo not in text:
              raise SystemExit('App remote action echo missing')
          text = text.replace(echo, '', 1)
          p.write_text(text, encoding='utf-8')

          # Remove the previous prototype monkey patch; the room client is now authoritative.
          Path('src/realtime-room-patch.ts').unlink(missing_ok=True)
          p = Path('src/main.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace("import './realtime-room-patch'\n", "", 1)
          p.write_text(text, encoding='utf-8')

      - name: Install and build
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Commit fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-room-stop-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/RoomPanel.tsx src/game/room-client.ts server/room-server.mjs src/main.tsx src/realtime-room-patch.ts .github/workflows/fix-room-stop-sync.yml
          git commit -m "Fix room stop sync and reduce periodic sync load"
          git push origin HEAD:main
